    return (<div className="chat-msg agent" key={msg.id}><div className="chat-avatar"><Icon.Sparkles size={14} color="#fff" /></div><div className="chat-bubble"><div style={{ marginBottom: msg.suggestions || msg.explanation || msg.comparison ? 8 : 0 }}>{msg.content}</div>{msg.suggestions && (<div className="chat-params-suggestion"><div className="chat-params-title">参数建议（点击填入配置）</div><div className="chat-params-grid">{msg.suggestions.map((s, i) => (<div key={i} className="chat-param-item" onClick={() => handleFillParam(s.key, s.val)}><span className="chat-param-key">{s.label}</span><span className="chat-param-val">{s.val}</span></div>))}</div>{msg.note && (<div style={{ marginTop: 8, fontSize: 11.5, color: 'var(--success)' }}>{msg.note}</div>)}</div>)}{msg.explanation && (<div style={{ marginTop: 8 }}>{msg.explanation.map((item, i) => (<div key={i} style={{ padding: '6px 0', borderBottom: i < msg.explanation.length - 1 ? '1px solid var(--border-subtle)' : 'none' }}><div style={{ fontSize: 12, fontWeight: 500, color: 'var(--text-primary)', marginBottom: 3 }}>{item.label}</div><div style={{ fontSize: 11.5, color: 'var(--text-tertiary)', lineHeight: 1.5 }}>{item.desc}</div></div>))}</div>)}{msg.comparison && (<div style={{ marginTop: 8 }}>{msg.comparison.map((item, i) => (<div key={i} style={{ padding: '6px 0', borderBottom: i < msg.comparison.length - 1 ? '1px solid var(--border-subtle)' : 'none' }}><div style={{ fontSize: 12, fontWeight: 500, color: 'var(--brand-400)', marginBottom: 3 }}>{item.label}</div><div style={{ fontSize: 11.5, color: 'var(--text-tertiary)', lineHeight: 1.5 }}>{item.desc}</div></div>))}</div>)}</div></div>);
  };
  return (<><button className={`agent-fab ${isOpen ? 'open' : ''}`} onClick={() => setIsOpen(!isOpen)} title="AI 助手">{isOpen ? <Icon.X size={22} color="#fff" /> : <Icon.Sparkles size={24} color="#fff" />}</button><div className={`agent-panel ${isOpen ? 'open' : ''}`}><div className="agent-panel-header"><div className="agent-avatar"><Icon.Sparkles size={18} color="#fff" /></div><div><div className="agent-info-name">SimForge AI 助手</div><div className="agent-info-status"><span className="dot"></span>在线 · 基于当前上下文</div></div><button className="agent-close-btn" onClick={() => setIsOpen(false)}><Icon.X size={14} /></button></div><div className="agent-panel-body">{messages.map(renderMessage)}{messages.length === 1 && (<div className="quick-prompts">{quickPrompts.map((p, i) => (<button key={i} className="quick-prompt-item" onClick={() => sendMessage(p)}>{p}</button>))}</div>)}</div><div className="agent-panel-footer"><div className="agent-input-wrap"><textarea className="agent-input" placeholder="输入你的问题..." rows={1} value={input} onChange={e => setInput(e.target.value)} onKeyDown={handleKeyDown} /><button className="agent-send-btn" onClick={() => sendMessage(input)} disabled={!input.trim()} style={{ opacity: input.trim() ? 1 : 0.5 }}><Icon.Send size={16} /></button></div></div></div></>);
}
Object.assign(window, { AIAgent });
  </script>
  <script type="text/babel">
function App() {
  const [isLoggedIn, setIsLoggedIn] = React.useState(false);
  const [currentPage, setCurrentPage] = React.useState('/dashboard');
  const [username, setUsername] = React.useState('');
  const [agentFillParams, setAgentFillParams] = React.useState({});
  const [paramKey, setParamKey] = React.useState(0);
  const handleLogin = (user) => { setUsername(user); setIsLoggedIn(true); setCurrentPage('/dashboard'); };
  const handleNavigate = (path) => { setCurrentPage(path); };
  const handleFillParams = (params) => { setAgentFillParams(params); setParamKey(prev => prev + 1); if (!currentPage.startsWith('/simulation/workload/inference')) { setCurrentPage('/simulation/workload/inference'); } };
  const renderPage = () => {
    if (currentPage === '/dashboard') { return <Dashboard onNavigate={handleNavigate} />; }
    if (currentPage.startsWith('/simulation/workload/inference')) { return <InferenceWorkload key={paramKey} agentFillParams={agentFillParams} />; }
    if (currentPage.startsWith('/simulation/workload/training') || currentPage.startsWith('/simulation/workload/general') || currentPage.startsWith('/simulation/workload/graph')) { return (<div className="page-header"><div><h1 className="page-title">负载建模</h1><p className="page-subtitle">该负载类型正在开发中，敬请期待</p></div></div>); }
    if (currentPage.startsWith('/simulation/system')) { return <SystemSimulation />; }
    if (currentPage === '/terminal') { return <TerminalPage />; }
    if (currentPage === '/energy') { return <EnergyPage />; }
    if (currentPage === '/infrastructure') { return <InfrastructurePage />; }
    return <Dashboard onNavigate={handleNavigate} />;
  };
  if (!isLoggedIn) { return <LoginPage onLogin={handleLogin} />; }
  return (<div className="app-shell"><Sidebar currentPage={currentPage} onNavigate={handleNavigate} /><div className="main-area"><TopBar currentPage={currentPage} /><main className="page-content">{renderPage()}</main></div><AIAgent currentPage={currentPage} onFillParams={handleFillParams} /></div>);
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
